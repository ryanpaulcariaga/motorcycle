name: CI/CD - Deploy to Azure

# Push to master -> CI (build, test, lint) -> deploy only the apps whose files changed.
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Deploy API, web, and admin regardless of changed files"
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/deploy.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            admin:
              - 'apps/admin/**'
              - '.github/workflows/deploy.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  deploy-api:
    needs: [ci, changes]
    if: needs.changes.outputs.api == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_all)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check Azure OIDC configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing '$name' in the 'production' environment secrets. See README 'Deploying to Azure' step 3."
              exit 1
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish apps/api/Motorcycle.Api/Motorcycle.Api.csproj --configuration Release --output ./publish-api

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to motorcycle-api-prod
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME || 'motorcycle-api-prod' }}
          package: ./publish-api

  deploy-web:
    needs: [ci, changes]
    if: needs.changes.outputs.web == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_all)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID NEXT_PUBLIC_API_URL NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing '$name' in the 'production' environment secrets/variables. See README 'Deploying to Azure' steps 3-4."
              exit 1
            fi
          done

      # NEXT_PUBLIC_* values are baked into the client bundle at build time.
      - name: Build
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Assemble standalone package
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to motorcycle-web-prod
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEB_APP_NAME || 'motorcycle-web-prod' }}
          package: apps/web/.next/standalone
          startup-command: HOSTNAME=0.0.0.0 node apps/web/server.js

  deploy-admin:
    needs: [ci, changes]
    if: needs.changes.outputs.admin == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_all)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID VITE_API_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing '$name' in the 'production' environment secrets/variables. See README 'Deploying to Azure' steps 3-4."
              exit 1
            fi
          done

      # VITE_API_URL is baked into the static bundle at build time.
      - name: Build
        run: pnpm --filter admin build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to motorcycle-admin-prod
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_ADMIN_APP_NAME || 'motorcycle-admin-prod' }}
          package: apps/admin/dist
          startup-command: node /home/site/wwwroot/server.mjs
